<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>U Commerce - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow mt-5">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            U Commerce
                        </h2>

                        <h4 class="text-center mb-4">
                            Login
                        </h4>

                        <form id="loginForm">

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    required
                                >

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Login
                            </button>

                        </form>


                        <div
                            id="message"
                            class="mt-3 text-center"
                        ></div>


                        <p class="text-center mt-3">

                            Don't have an account?

                            <a href="/signup">
                                Sign Up
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
